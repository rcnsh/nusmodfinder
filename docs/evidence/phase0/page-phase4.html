<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUSMods semantic search</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1b1a18; --muted: #6b6862;
    --line: #e5e1da; --accent: #b4541f; --accent-soft: #fdf0e8; --shadow: rgba(27,26,24,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a; --panel: #1f1e24; --ink: #ececf0; --muted: #9a97a3;
      --line: #302e38; --accent: #ff9a62; --accent-soft: #2a211c; --shadow: rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 96px; }
  header { margin-bottom: 28px; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; font-weight: 620; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .sub code { background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

  form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px var(--shadow); }
  .row { display: flex; gap: 8px; }
  input[type=search], select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  }
  input[type=search] { flex: 1; min-width: 0; }
  input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 560; cursor: pointer; color: #fff; background: var(--accent);
    border: 0; border-radius: 9px; padding: 10px 18px;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .filters select { width: 100%; }

  .toggle { display: flex; align-items: center; gap: 9px; margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line); cursor: pointer; user-select: none; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track { flex: none; width: 34px; height: 20px; border-radius: 20px; background: var(--line); position: relative; transition: background .15s ease; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px var(--shadow); transition: transform .15s ease; }
  .toggle input:checked + .track { background: var(--accent); }
  .toggle input:checked + .track::after { transform: translateX(14px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle .label { font-size: 13px; }
  .toggle .hint { font-size: 12px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none } }

  .study { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .study select { padding: 6px 8px; }
  .sources { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .sources a { color: var(--accent); }
  .notes { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .notes li { background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; font-size: 12.5px; color: var(--ink); }
  .notes li::before { content: "Note"; display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 20px; font-size: 10.5px; font-weight: 600;
        color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line); }
  .ng { display: inline-block; margin-left: 7px; padding: 1px 7px; border-radius: 20px; font-size: 10.5px; font-weight: 600;
        letter-spacing: .02em; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line); vertical-align: 1px; }

  .status { margin: 22px 2px 0; color: var(--muted); font-size: 13.5px; }
  .status.error { color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .status .chips { margin-top: 6px; }
  .chip { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 20px; padding: 2px 9px; font-size: 12px; margin-right: 5px; }

  ol { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; box-shadow: 0 1px 2px var(--shadow); }
  .head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; color: var(--accent); }
  .title { font-weight: 560; }
  .score { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  .meta span + span::before { content: "·"; margin: 0 7px; opacity: .55; }

  .skeleton { height: 66px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NUSMods semantic search</h1>
    <p class="sub">Describe what you want to study, or type a code like <code>CS3244</code>. Data: unofficial NUSMods API, AY2026&#8288;/&#8288;2027.</p>
  </header>

  <form id="f">
    <div class="row">
      <input type="search" id="q" name="q" maxlength="200" placeholder="e.g. machine learning for beginners" autocomplete="off" aria-label="Search query">
      <button type="submit" id="go">Search</button>
    </div>
    <div class="filters">
      <label>Semester
        <select id="sem"><option value="">Any</option><option value="1">1</option><option value="2">2</option><option value="3">Special term 1</option><option value="4">Special term 2</option></select>
      </label>
      <label>Level
        <select id="level"><option value="">Any</option></select>
      </label>
      <label>Credits
        <select id="credits"><option value="">Any</option><option>2</option><option>4</option><option>5</option><option>6</option><option>8</option><option>12</option></select>
      </label>
      <label>Faculty
        <select id="faculty"><option value="">Any</option></select>
      </label>
    </div>
    <label class="toggle" for="ng">
      <input type="checkbox" id="ng">
      <span class="track" aria-hidden="true"></span>
      <span>
        <span class="label">Open to exchange students only</span>
        <span class="hint" id="ngHint"></span>
      </span>
    </label>
    <label class="study" id="studyWrap" hidden>Your year of study at your home university
      <select id="study">
        <option value="">Choose…</option><option value="ug1">1st year</option><option value="ug2">2nd year</option>
        <option value="ug3">3rd year</option><option value="ug4">4th year or later</option><option value="grad">Graduate</option>
      </select>
    </label>
    <div class="sources" id="sources" hidden></div>
  </form>

  <div id="status" class="status">Type a query to begin.</div>
  <ol id="results"></ol>
</div>

<script>
const $ = (id) => document.getElementById(id);
const els = { form: $('f'), q: $('q'), go: $('go'), status: $('status'), results: $('results') };
const filterIds = ['sem', 'level', 'credits', 'faculty'];
const STUDY_NAMES = { ug1: '1st year', ug2: '2nd year', ug3: '3rd year', ug4: '4th year or later', grad: 'Graduate' };
// Exchange mode needs the year of study (the restrictions depend on it); it is
// remembered on this device so a returning student isn't asked again.
const STUDY_KEY = 'vnm.study';
const savedStudy = () => { try { return localStorage.getItem(STUDY_KEY) ?? ''; } catch { return ''; } };
const saveStudy = (v) => { try { localStorage.setItem(STUDY_KEY, v); } catch { /* private mode */ } };
function syncExchange() {
  $('studyWrap').hidden = !$('ng').checked;
  $('sources').hidden = !$('ng').checked || !$('sources').innerHTML;
}
const SEM_LABEL = (s) => SEM_NAMES[s] ?? s;
const SEM_NAMES = { 1: 'Sem 1', 2: 'Sem 2', 3: 'Special term 1', 4: 'Special term 2' };

// The level and faculty options are fetched, so anything that restores those
// selects has to wait on this — setting .value on a <select> whose options have
// not arrived yet is a silent no-op, which would quietly drop filters from a
// shared URL. Never rejects: missing vocabulary degrades to a working page.
const facetsReady = fetch('/facets')
  .then((r) => r.json())
  .then((f) => {
    for (const l of f.levels ?? []) $('level').add(new Option(`${l.level}000 (${l.count})`, l.level));
    for (const x of f.faculties ?? []) $('faculty').add(new Option(`${x.name} (${x.count})`, x.name));
    if (f.ng) {
      $('ngHint').textContent = f.ng.count
        ? ` — ${f.ng.count} courses, NUS Registrar list${f.ng.updatedAsAt ? `, ${f.ng.updatedAsAt}` : ''}`
        : ' — list not loaded';
    }
    if (f.ngSources?.length) {
      $('sources').innerHTML = 'Sources: ' + f.ngSources
        .map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a> (updated ${esc(x.updatedAsAt)})`).join('; ')
        + '. Check with NUS before you register.';
      syncExchange();
    }
  })
  .catch(() => { /* filters still work without the vocabulary */ });

function setStatus(html, isError) {
  els.status.className = 'status' + (isError ? ' error' : '');
  els.status.innerHTML = html;
}

function showSkeletons() {
  els.results.innerHTML = '<li class="skeleton"></li>'.repeat(5);
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render(data) {
  const chips = Object.entries(data.filters ?? {})
    .map(([k, v]) => k === 'ng'
      ? '<span class="chip">exchange students only</span>'
      : k === 'study'
        ? `<span class="chip">${esc(STUDY_NAMES[v] ?? v)}</span>`
        : `<span class="chip">${esc(k)}: ${esc(k === 'sem' ? SEM_LABEL(v) : v)}</span>`).join('');
  if (data.noMatch?.reason === 'ng-special-term') {
    els.results.innerHTML = '';
    setStatus('The Registrar\'s exchange-student list covers Semesters 1 and 2 only, so there is nothing to show for a special term.');
    return;
  }
  if (data.count === 0) {
    els.results.innerHTML = '';
    setStatus(`No modules matched <strong>${esc(data.query)}</strong>.${chips ? `<div class="chips">Filters applied: ${chips}</div><div style="margin-top:6px">Try loosening one.</div>` : ''}`);
    return;
  }
  setStatus(`${data.count} result${data.count === 1 ? '' : 's'} for <strong>${esc(data.query)}</strong>${chips ? `<div class="chips">${chips}</div>` : ''}`);
  els.results.innerHTML = data.results.map((m) => `
    <li>
      <div class="head">
        <span class="code">${esc(m.code)}</span>
        <span class="title">${esc(m.title)}${m.ng ? `<span class="ng" title="On the Registrar's list of courses offered to exchange (Non-Graduating) students">NG ${esc((m.ngSemesters ?? []).map(SEM_LABEL).join(', '))}</span>` : ''}</span>
        <span class="score">${(m.score ?? 0).toFixed(3)}</span>
      </div>
      <div class="meta">
        <span>${esc(m.department || m.faculty || '')}</span>
        <span>${m.credits ?? '?'} units</span>
        <span>${(m.semesters ?? []).length ? m.semesters.map((s) => SEM_NAMES[s] ?? s).join(', ') : 'Not offered'}</span>
      </div>
      ${m.exchange?.reasons?.length ? `<ul class="notes">${m.exchange.reasons.map((r) => `<li>${esc(r.text)}</li>`).join('')}</ul>` : ''}
    </li>`).join('');
}

let inFlight = 0;
async function search(pushState = true) {
  const q = els.q.value.trim();
  if (!q) { setStatus('Type a query to begin.'); els.results.innerHTML = ''; return; }

  const params = new URLSearchParams({ q });
  for (const id of filterIds) { const v = $(id).value; if (v) params.set(id, v); }
  if ($('ng').checked) {
    // Asked before the first exchange search: what a student may take depends on it.
    if (!$('study').value) {
      els.results.innerHTML = '';
      setStatus('Choose your year of study to see the courses open to you as an exchange student.');
      $('study').focus();
      return;
    }
    params.set('ng', '1');
    params.set('study', $('study').value);
  }
  if (pushState) history.replaceState(null, '', `?${params}`);

  const ticket = ++inFlight;
  els.go.disabled = true;
  setStatus('Searching…');
  showSkeletons();
  try {
    const res = await fetch(`/search?${params}`);
    const body = await res.json();
    if (ticket !== inFlight) return;            // a newer search already won
    if (!res.ok) {
      els.results.innerHTML = '';
      setStatus(`<strong>${esc(body.error ?? res.status)}</strong><br>${esc(body.message ?? 'The search failed.')}`, true);
      return;
    }
    render(body);
  } catch (err) {
    if (ticket !== inFlight) return;
    els.results.innerHTML = '';
    setStatus(`<strong>Could not reach the search service.</strong><br>${esc(err.message)}`, true);
  } finally {
    if (ticket === inFlight) els.go.disabled = false;
  }
}

els.form.addEventListener('submit', (e) => { e.preventDefault(); search(); });
// Implicit form submission on Enter is easy to lose (an input outside the form,
// a browser that treats type=search differently). Bind it explicitly so the
// primary interaction never depends on that behaviour.
els.q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); search(); }
});
for (const id of [...filterIds, 'ng', 'study']) $(id).addEventListener('change', () => { if (els.q.value.trim()) search(); });
$('ng').addEventListener('change', syncExchange);
$('study').addEventListener('change', () => saveStudy($('study').value));
$('study').value = savedStudy();

const initial = new URLSearchParams(location.search);
if (initial.get('q')) {
  els.q.value = initial.get('q');
  facetsReady.then(() => {
    for (const id of filterIds) {
      const v = initial.get(id);
      if (v) $(id).value = v;
    }
    if (initial.get('ng')) $('ng').checked = true;
    if (STUDY_NAMES[initial.get('study')]) $('study').value = initial.get('study');
    syncExchange();
    search(false);
  });
}
</script>
</body>
</html>
