  - region "Totals":
    - heading "Totals" [level=3]
    - region "Sem 1 picks":
      - heading "Sem 1 picks" [level=4]
      - paragraph: 8 units counted, if NUS accepts you into each plus 4 units to confirm with NUS plus 4 units only if invited 8 units is about 20 hours a week at NUS's rate (2.5 hours a week per unit).
      - paragraph: "If you were invited: Business courses are very popular, so a place is not guaranteed. NUS students who need them for their degree, and students from the Business School's own exchange partners, get places first."
      - paragraph: Not counted
      - paragraph: "CS3244 (backup 1): not on NUS's 2026/27 exchange course list for Sem 1. Courses not on the list “are not available during application stage but may be available during Course registration” (the Registrar's course restrictions, rule E)"
    - list:
      - listitem: "To be admitted, NUS must accept you into at least 12 units in a semester (NUS's brochure; GRO: “three pre-registered courses (or 12 units)”)"
      - listitem: In CourseReg you must keep at least 12 units or three courses (GRO)
      - listitem: "NUS’s brochure says at most 23 units a semester, but NUS Global’s exchange page says 20 (NUS Business School’s exchange students: 20). Ask NUS before planning more than 20. This limits the courses NUS enrols you in, not the courses you list."
      - listitem: NUS states hours a week only; your university's own conversion decides credit.
      - listitem: "GRO: “Each semester normally includes 13 weeks of instruction and 2 weeks of examinations”"
  - region "NUS's application form order, for applicants":
    - heading "NUS's application form order, for applicants" [level=3]
    - paragraph: "This order uses NUS's 2026/27 exchange list and exams. Applying for 2027/28? NUS publishes Sem 1's list in March or April, Sem 2's later (the 2026/27 list is dated 1 Sep 2026), and the timetable in July or August (the Registrar says mid-July): check each course there."
    - 'table "Sem 1 on NUS''s form: 16 of 40 units"':
      - caption: "Sem 1 on NUS's form: 16 of 40 units"
      - rowgroup:
        - row "No. Course Units On your list":
          - columnheader "No."
          - columnheader "Course"
          - columnheader "Units"
          - columnheader "On your list"
      - rowgroup:
        - row "1 CS2113 4 Pick 1":
          - cell "1"
          - rowheader "CS2113"
          - cell "4"
          - cell "Pick 1"
        - row "2 GE2101 4 Pick 2":
          - cell "2"
          - rowheader "GE2101"
          - cell "4"
          - cell "Pick 2"
        - row "3 PC3270 4 Pick 3":
          - cell "3"
          - rowheader "PC3270"
          - cell "4"
          - cell "Pick 3"
        - row "4 EE4407 4 Backup 2":
          - cell "4"
          - rowheader "EE4407"
          - cell "4"
          - cell "Backup 2"
    - list:
      - listitem: NUS recommends listing as many relevant courses as you can, up to 40 units (GRO)
      - listitem: NUS recommends ranking your compulsory courses among your top three choices, to increase your chances of securing them (GRO)
      - listitem: NUS's form asks, for each course with a prerequisite, the home course that meets it (NUS's application guide)
      - listitem: "GRO: “If you did not secure any of the popular courses during the first round … please do not repeat your request for any of these courses in subsequent rounds”"
  - region "Already admitted? NUS's rules for CourseReg":
    - heading "Already admitted? NUS's rules for CourseReg" [level=3]
    - list:
      - listitem: Keep at least 12 units or three courses a semester (GRO)
      - listitem: Drop any course that clashes (GRO)
      - listitem: "On Business, Law and Economics courses: “If you are not successful in gaining placements into these popular courses at the point of offer, you are not able to add these courses during CourseReg” (GRO)"
      - listitem: Missing the drop deadlines “could lead to a Grade 'W' (Withdrawn) or a Grade 'F' (Fail) printed on your transcript” (GRO)
      - listitem: The Registrar's Non-Graduating Office signs your Learning Agreement or Study Plan (GRO)
      - listitem: “no particular course can be guaranteed by NUS” (GRO)
      - listitem: A course not approved at application can be requested in “Submit Course Requests” or appealed as “Unable to secure course” (NUS's CourseReg FAQ)
      - listitem: “Students are not allowed to read courses with any kind of timetable clashes” (NUS's CourseReg FAQ)
      - listitem: You can't drop below the minimum workload (NUS's CourseReg FAQ)
      - listitem: You may request “up to 23 Units in one course request”; above that, a Max Workload Waiver (NUS's CourseReg FAQ)
      - listitem: Courses not on the exchange course list “are not available during application stage but may be available during Course registration” (the Registrar's course restrictions, rule E)
      - listitem: “To check if the course is offered to Non-Graduating students, refer to the Vacancy Report” (NUS's CourseReg FAQ)
      - listitem: Get your home university's approval before changing your study plan (NUS's brochure)
    - paragraph: This page can't see your offer. Your offer and CourseReg show which courses are yours.
  - paragraph: "Class times and corequisites aren't checked here: see each course on NUSMods."
  - paragraph: NUS posts each course's full syllabus on Canvas when the semester starts; the text here is NUS's course description (the Registrar's NG course list).
  - paragraph: For courses that have prerequisites, NUS asks for the syllabi of the courses you have completed or are taking (NUS's brochure).
  - paragraph:
    - button "Forget this list on this device"
