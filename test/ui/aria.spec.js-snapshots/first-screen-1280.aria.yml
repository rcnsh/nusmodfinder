- link "Skip to main content":
  - /url: "#setup"
- banner:
  - heading "NUS Mod Finder ( unofficial )" [level=1]:
    - link "NUS Mod Finder":
      - /url: /
    - text: ( unofficial )
  - paragraph: NUS's 2026/27 courses and exchange lists. Applying for 2027/28? NUS publishes Sem 1's list in March or April; until July, this site shows 2026/27's.
  - status
- main "Find NUS courses in your own words":
  - heading "Find NUS courses in your own words" [level=2]
  - paragraph: Describe what you want to study, or type course codes. On exchange at NUS? Choose exchange student, and every course shows whether you may take it in your semester, and any conditions.
  - form "Search NUS courses":
    - group "Who are you searching as?":
      - paragraph: Who are you searching as?
      - paragraph: Exchange students can take only some NUS courses.
      - radio "NUS student Every NUS course" [checked]
      - text: NUS student Every NUS course
      - radio "Exchange student Only the courses open to exchange students"
      - text: Exchange student Only the courses open to exchange students
    - text: What do you want to study?
    - paragraph: A subject in your own words, a course name, or codes.
    - searchbox "What do you want to study?"
    - button "Search"
    - paragraph:
      - button "Browse all courses instead"
- contentinfo:
  - paragraph: An unofficial site, not run by NUS or NUSMods. Course data comes from NUSMods; who may take each course comes from the NUS Registrar's lists. Check with NUS before you register.
  - list:
    - listitem:
      - link "NUSMods":
        - /url: https://nusmods.com/
    - listitem:
      - link "Courses offered to exchange (NG) students":
        - /url: https://www.nus.edu.sg/registrar/prospective-students/non-graduating
    - listitem:
      - link "Course restrictions for exchange (NG) students":
        - /url: https://www.nus.edu.sg/registrar/docs/default-source/prospective-students---non-graduating/non-graduating-course-restrictions.pdf
    - listitem:
      - link "The Registrar's course vacancy report":
        - /url: https://nus.edu.sg/coursereg/resources.html
    - listitem:
      - link "Privacy":
        - /url: /privacy
