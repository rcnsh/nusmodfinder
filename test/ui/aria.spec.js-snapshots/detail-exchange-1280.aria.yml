    - heading "Description" [level=4]
    - paragraph: The course provides an introduction to accounting from a user perspective. Financial reporting is covered from the viewpoint of an external investor. The focus is on how accounting can help investors make better decisions. Book-keeping and preparation of financial statements are also covered at an introductory level, as investors need to be aware of how the financial statements are derived.
    - heading "Prerequisites" [level=4]
    - paragraph: No course you must pass first. NUS's rule only names groups of NUS students by the year they started; ask NUS whether it applies to you.
    - group: As NUS states it
    - heading "Preclusions" [level=4]
    - paragraph: "As NUS states it:"
    - paragraph:
      - text: If undertaking an Undergraduate Degree THEN ((must not be undertaking 1 of 0200ACCHON Bachelor of Business Administration (Accountancy), 0200BBAHON Bachelor of Business Administration (Hons), 0200BIZMAJ Bachelor of Business Administration Hons - Undeclared Major, 0200BREHON Bachelor of Business Administration (Real Estate) Hons, 0200BIZHON Bachelor of Business Administration Hons - General Management, 0200OSCHON Bachelor of Business Administration Hons - Operations & Supply Chain Management, 0200MKTHON Bachelor of Business Administration Hons - Marketing, 0200LHCHON Bachelor of Business Administration Hons - Leadership & Human Capital Management, 0200ACYHON Bachelor of Business Administration (Accountancy) Hons, 0200INEHON Bachelor of Business Administration Hons - Innovation & Entrepreneurship, 0200BECHON Bachelor of Business Administration Hons - Business Economics, 0200FINHON Bachelor of Business Administration Hons - Finance, 0200ABAHON Bachelor of Business Administration Hons - Applied Business Analytics) OR ( must not have completed 1 of
      - link "EC2204":
