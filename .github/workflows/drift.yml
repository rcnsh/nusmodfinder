name: Drift

# ADR 0011: the weekly NUSMods data-change check and the monthly reminder.
# It reads NUSMods' public API and writes issues; it makes no Cloudflare call and no live-site
# call. The logic is in scripts/drift.mjs (tested in test/drift*.node.test.js); this file only
# runs it. The crons must match SCHEDULES in scripts/drift.mjs.
on:
  schedule:
    - cron: '17 1 * * 1'   # weekly: Monday 01:17 UTC
    - cron: '41 1 1 * *'   # monthly: the 1st, 01:41 UTC
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        options: [weekly, monthly]
        default: weekly

permissions:
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The last moduleInfo.json and its ETag, so the weekly fetch is conditional and the next
      # check can count what changed. A miss (first run, or evicted) means one full fetch.
      - uses: actions/cache/restore@v6
        with:
          path: .data/drift-cache
          key: drift-nusmods-${{ github.run_id }}
          restore-keys: drift-nusmods-
      - name: Check
        id: drift
        run: node scripts/drift.mjs "$CHECK" --cache-dir .data/drift-cache
        env:
          CHECK: ${{ inputs.check }}
          SCHEDULE: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/save@v6
        if: always() && hashFiles('.data/drift-cache/*.cache.json') != ''
        with:
          path: .data/drift-cache
          key: drift-nusmods-${{ github.run_id }}
      - name: Open an issue for a failed step
        if: failure() && steps.drift.outcome != 'failure'
        run: node scripts/drift.mjs failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
