name: CI

# Phase 7 7A: every job always starts, so no change can merge untested and a red main is seen.
# `check` and `eval-gate` never skip. The heavy jobs skip by steps, on scripts/ci-changes.mjs's
# outputs (a PR diffs against its base, a push to main against main's last green CI run), and run
# in full when `changes` fails. test/ci-workflow.node.test.js holds this shape.
on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs run nothing; CI starts when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  # ci-changes.mjs and eval-gate list this workflow's runs to find main's last green commit.
  actions: read

concurrency:
  # PRs cancel superseded runs; runs on main are grouped per sha, so none cancels another.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ui: ${{ steps.diff.outputs.ui }}
      grid: ${{ steps.diff.outputs.grid }}
      rollover: ${{ steps.diff.outputs.rollover }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Which heavy jobs does this change need?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-changes.mjs

  check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # db:rebuild-check rebuilds the old recipe from commit 3b18041;
          # test:eval overlays tag eval-v0.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated types are up to date
        run: npm run types:check
      - run: npm test
      - name: Eval harness self-test (fixture set, committed embeddings, no Cloudflare)
        run: npm run test:eval
      - name: Holdout ciphertexts match their manifests (no key)
        run: npm run eval:verify
      - name: Migrations rebuild the production schema
        run: npm run db:rebuild-check

  # Phase 7 7A: the ranking lock (eval/ranking-lock.json, docs/REFERENCE.md "The ranking lock").
  # The fast path needs only git and Node; off it, the eval runner recomputes the open-set lists
  # (dev filtered, `--strip ng` and `--unfiltered` on the pinned corpus, the fixture on its own)
  # from release assets, with no Cloudflare call.
  eval-gate:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PINNED_RELEASE: data-2026-2027-20260904
      MODULE_INFO: .data/2026-2027-moduleInfo.json
      MODULE_INFO_SHA256: 2d138795d387d133237669a7f5a22c7c4d30b4a26bf82dad0a982636e80857b1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: The base (a PR's base, else main's last green CI run)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-changes.mjs --base-only
      - name: Fast path (the lock and the eval's inputs unchanged)
        id: fast
        run: npm run eval:lock -- --check --fast-only --base "${{ steps.base.outputs.base }}"
      - uses: actions/setup-node@v7
        if: steps.fast.outputs.fast != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.fast.outputs.fast != 'true'
        run: npm ci
      - name: Restore pinned corpus
        if: steps.fast.outputs.fast != 'true'
        id: corpus
        uses: actions/cache@v6
        with:
          path: ${{ env.MODULE_INFO }}
          key: corpus-${{ env.MODULE_INFO_SHA256 }}
      - name: Download pinned corpus from the release (never api.nusmods.com)
        if: steps.fast.outputs.fast != 'true' && steps.corpus.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="$(mktemp -d)"
          gh release download "$PINNED_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '2026-2027-moduleInfo.json.gz' --dir "$dl"
          mkdir -p .data
          gunzip -c "$dl/2026-2027-moduleInfo.json.gz" > "$MODULE_INFO"
      - name: Verify raw sha256
        if: steps.fast.outputs.fast != 'true'
        run: echo "$MODULE_INFO_SHA256  $MODULE_INFO" | sha256sum -c -
      - name: Restore the corpus embeddings
        if: steps.fast.outputs.fast != 'true'
        uses: actions/cache@v6
        with:
          path: .data/emb
          key: emb-${{ hashFiles('eval/embeddings.json') }}
      - name: Recompute the lists and check the lock (the corpus embeddings come from their release, sha-checked)
        if: steps.fast.outputs.fast != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run eval:lock -- --check --base "${{ steps.base.outputs.base }}"

  full-corpus:
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A missing output (a failed `changes`) is not 'false', so the job runs in full.
      RUN: ${{ needs.changes.outputs.code != 'false' }}
      # The lexical brute-force grid (~12 min of this job) runs in full only when code it covers
      # changes, or on a full run; otherwise a fixed 1-in-10 sample (test/full/lexical.test.js,
      # vitest.config.mjs).
      LEXICAL_GRID: ${{ needs.changes.outputs.grid != 'false' && 'full' || 'sample' }}
      FULL_CORPUS: '1'
      PINNED_RELEASE: data-2026-2027-20260904
      MODULE_INFO: .data/2026-2027-moduleInfo.json
      MODULE_INFO_SHA256: 2d138795d387d133237669a7f5a22c7c4d30b4a26bf82dad0a982636e80857b1
    steps:
      - name: Does the change touch code? (RUN=${{ env.RUN }}, lexical grid ${{ env.LEXICAL_GRID }})
        run: 'echo "full-corpus runs: $RUN; lexical grid: $LEXICAL_GRID"'
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.RUN == 'true'
        run: npm ci
      - name: Restore pinned corpus
        if: env.RUN == 'true'
        id: corpus
        uses: actions/cache@v6
        with:
          path: ${{ env.MODULE_INFO }}
          key: corpus-${{ env.MODULE_INFO_SHA256 }}
      - name: Download pinned corpus from the release (never api.nusmods.com)
        if: env.RUN == 'true' && steps.corpus.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="$(mktemp -d)"
          gh release download "$PINNED_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '2026-2027-moduleInfo.json.gz' --dir "$dl"
          mkdir -p .data
          gunzip -c "$dl/2026-2027-moduleInfo.json.gz" > "$MODULE_INFO"
      - name: Verify raw sha256
        if: env.RUN == 'true'
        run: echo "$MODULE_INFO_SHA256  $MODULE_INFO" | sha256sum -c -
      # Phase 3 3-0 (B2-4): test/full searches the pinned vectors bundle, the
      # catalogue the eval scores. data/vectors.json names its release asset
      # and sha256; the fetch checks it, and FULL_CORPUS=1 makes a missing or
      # mismatched bundle fail the run (vitest.config.mjs).
      - name: Restore the pinned vectors bundle
        if: env.RUN == 'true'
        id: vectors
        uses: actions/cache@v6
        with:
          path: .data/vectors
          key: vectors-${{ hashFiles('data/vectors.json') }}
      - name: Download the pinned vectors bundle from its release, sha-checked
        if: env.RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/vectors.mjs fetch --corpus pinned
      - name: Run test/full
        if: env.RUN == 'true'
        run: npx vitest run test/full --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/full.json"
      - name: Fail if no full-corpus test ran
        if: env.RUN == 'true'
        run: |
          node -e '
            const r = require(process.argv[1]);
            console.log(`passed ${r.numPassedTests}, skipped ${r.numPendingTests + r.numTodoTests}, total ${r.numTotalTests}`);
            if (r.numPassedTests === 0 || r.numPassedTests !== r.numTotalTests) process.exit(1);
          ' "$RUNNER_TEMP/full.json"

  # Phase 4 4E: SC1's path tests over the pinned corpus and bundle, in their
  # own job with their own timeout (docs/plans/phase4.md 4E, A2-5).
  sc1:
    # Phase 7 7D: CI on the live year. sc1 and sc1-node run over production's
    # corpus (`current` in data/corpus.json, restored from its release asset)
    # and the production bundle and data files, not the pinned corpus.
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
      PRODUCTION_CORPUS: '1'
    steps:
      - name: Does the change touch code? (RUN=${{ env.RUN }})
        run: 'echo "sc1 runs: $RUN"'
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.RUN == 'true'
        run: npm ci
      - name: Restore the production corpus cache
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          path: .data/prod
          key: corpus-prod-${{ hashFiles('data/corpus.json') }}
      - name: Restore `current` from its release asset, sha-checked (never api.nusmods.com)
        if: env.RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run corpus -- restore
      - name: Restore the production vectors bundle
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          path: .data/vectors
          # Its own key: full-corpus caches the pinned bundle under vectors-<hash>.
          key: vectors-production-${{ hashFiles('data/vectors.json') }}
      - name: Download the production vectors bundle from its release, sha-checked
        if: env.RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/vectors.mjs fetch --corpus production
      - name: The data version and catalogueKey follow `current`
        if: env.RUN == 'true'
        run: npm run corpus -- check
      - name: Run test/sc1 (sc1 and sc1-node)
        if: env.RUN == 'true'
        run: npx vitest run --project sc1 --project sc1-node --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/sc1.json"
      - name: Fail if no SC1 test ran, or any was skipped
        if: env.RUN == 'true'
        run: |
          node -e '
            const r = require(process.argv[1]);
            console.log(`passed ${r.numPassedTests}, skipped ${r.numPendingTests + r.numTodoTests}, total ${r.numTotalTests}`);
            if (r.numPassedTests === 0 || r.numPassedTests !== r.numTotalTests) process.exit(1);
          ' "$RUNNER_TEMP/sc1.json"

  # Phase 7 7E: the year-switch rehearsal (scripts/rollover.mjs; docs/year-refresh/README.md). In a
  # temp copy it relabels the pinned corpus as next year's and runs the switch the runbook gives:
  # `year next`, the builders, `year check`, a local Worker (wrangler dev --local, FakeAI) seeded with
  # this year and switched by `ingest --d1-only --allow-year-change --write-budget 80000`, `verify
  # --pre-deploy`, SC1 against next year's oracle, and the variant with Sem 2 unpublished (G2).
  # No PDF, no archive, no Cloudflare account: the pinned corpus and the eval's embeddings come
  # from their releases, sha-checked.
  rollover:
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN: ${{ needs.changes.outputs.rollover != 'false' }}
      PINNED_RELEASE: data-2026-2027-20260904
      MODULE_INFO: .data/2026-2027-moduleInfo.json
      MODULE_INFO_SHA256: 2d138795d387d133237669a7f5a22c7c4d30b4a26bf82dad0a982636e80857b1
    steps:
      - name: Does the change touch code? (RUN=${{ env.RUN }})
        run: 'echo "rollover runs: $RUN"'
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.RUN == 'true'
        run: npm ci
      - name: Restore pinned corpus
        if: env.RUN == 'true'
        id: corpus
        uses: actions/cache@v6
        with:
          path: ${{ env.MODULE_INFO }}
          key: corpus-${{ env.MODULE_INFO_SHA256 }}
      - name: Download pinned corpus from the release (never api.nusmods.com)
        if: env.RUN == 'true' && steps.corpus.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="$(mktemp -d)"
          gh release download "$PINNED_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '2026-2027-moduleInfo.json.gz' --dir "$dl"
          mkdir -p .data
          gunzip -c "$dl/2026-2027-moduleInfo.json.gz" > "$MODULE_INFO"
      - name: Verify raw sha256
        if: env.RUN == 'true'
        run: echo "$MODULE_INFO_SHA256  $MODULE_INFO" | sha256sum -c -
      - name: Restore the eval's corpus embeddings
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          path: .data/emb
          key: emb-${{ hashFiles('eval/embeddings.json') }}
      - name: The rehearsal (the embeddings download from their release when the cache misses, sha-checked)
        if: env.RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rollover.mjs

  # Phase 5 5B: the page in Chromium and WebKit (Playwright, with axe) against
  # the local UI stack: scripts/ui-server.mjs runs `wrangler dev --local` on
  # test/wrangler.ui.jsonc (FakeAI, no remote binding) over a D1 seeded with
  # the fixture. It runs when `changes` says the UI suite's paths changed.
  ui:
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    # Playwright's own image carries Chromium, WebKit and their system libraries, so the job
    # installs nothing with apt: installing the browsers' system libraries hung the job to its timeout
    # whenever the runner could not resolve Ubuntu's mirrors. The tag follows the locked
    # @playwright/test version (test/ci-workflow.node.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    # One job per browser: the two together took 16 minutes on a runner by Phase 6 (limit 20).
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    name: ui (${{ matrix.project }})
    timeout-minutes: 20
    env:
      RUN: ${{ needs.changes.outputs.ui != 'false' }}
    steps:
      - name: Does the change touch anything the UI suite covers? (RUN=${{ env.RUN }})
        run: 'echo "ui suite runs: $RUN"'
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.RUN == 'true'
        run: npm ci
      - name: UI suite (${{ matrix.project }})
        if: env.RUN == 'true'
        run: npm run test:ui -- --project=${{ matrix.project }}
      - name: Keep the traces of failed tests
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
