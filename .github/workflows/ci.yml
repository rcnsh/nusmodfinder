name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/*.md', 'docs/decisions/**', '*.md']
  pull_request:
    # Draft PRs run nothing; CI starts when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/*.md', 'docs/decisions/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # db:rebuild-check rebuilds the old recipe from commit 3b18041;
          # test:eval overlays tag eval-v0.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated types are up to date
        run: npm run types:check
      - run: npm test
      - name: Eval harness self-test (fixture set, committed embeddings, no Cloudflare)
        run: npm run test:eval
      - name: Holdout ciphertexts match their manifests (no key)
        run: npm run eval:verify
      - name: Migrations rebuild the production schema
        run: npm run db:rebuild-check

  full-corpus:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FULL_CORPUS: '1'
      PINNED_RELEASE: data-2026-2027-20260904
      MODULE_INFO: .data/2026-2027-moduleInfo.json
      MODULE_INFO_SHA256: 2d138795d387d133237669a7f5a22c7c4d30b4a26bf82dad0a982636e80857b1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The lexical brute-force grid (~12 min of this job) runs in full only
      # when code it covers changes, or on a manual run; otherwise a fixed
      # 1-in-10 sample (test/full/lexical.test.js, vitest.config.mjs).
      - name: Full or sampled lexical grid
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          grid=full
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- src migrations scripts test/full vitest.config.mjs test/wrangler.test.jsonc package-lock.json; then
            grid=sample
          fi
          echo "lexical grid: $grid"
          echo "LEXICAL_GRID=$grid" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore pinned corpus
        id: corpus
        uses: actions/cache@v6
        with:
          path: ${{ env.MODULE_INFO }}
          key: corpus-${{ env.MODULE_INFO_SHA256 }}
      - name: Download pinned corpus from the release (never api.nusmods.com)
        if: steps.corpus.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="$(mktemp -d)"
          gh release download "$PINNED_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '2026-2027-moduleInfo.json.gz' --dir "$dl"
          mkdir -p .data
          gunzip -c "$dl/2026-2027-moduleInfo.json.gz" > "$MODULE_INFO"
      - name: Verify raw sha256
        run: echo "$MODULE_INFO_SHA256  $MODULE_INFO" | sha256sum -c -
      # Phase 3 3-0 (B2-4): test/full searches the pinned vectors bundle, the
      # catalogue the eval scores. data/vectors.json names its release asset
      # and sha256; the fetch checks it, and FULL_CORPUS=1 makes a missing or
      # mismatched bundle fail the run (vitest.config.mjs).
      - name: Restore the pinned vectors bundle
        id: vectors
        uses: actions/cache@v6
        with:
          path: .data/vectors
          key: vectors-${{ hashFiles('data/vectors.json') }}
      - name: Download the pinned vectors bundle from its release, sha-checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/vectors.mjs fetch --corpus pinned
      - name: Run test/full
        run: npx vitest run test/full --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/full.json"
      - name: Fail if no full-corpus test ran
        run: |
          node -e '
            const r = require(process.argv[1]);
            console.log(`passed ${r.numPassedTests}, skipped ${r.numPendingTests + r.numTodoTests}, total ${r.numTotalTests}`);
            if (r.numPassedTests === 0 || r.numPassedTests !== r.numTotalTests) process.exit(1);
          ' "$RUNNER_TEMP/full.json"

  # Phase 4 4E: SC1's path tests over the pinned corpus and bundle, in their
  # own job with their own timeout (docs/plans/phase4.md 4E, A2-5).
  sc1:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FULL_CORPUS: '1'
      PINNED_RELEASE: data-2026-2027-20260904
      MODULE_INFO: .data/2026-2027-moduleInfo.json
      MODULE_INFO_SHA256: 2d138795d387d133237669a7f5a22c7c4d30b4a26bf82dad0a982636e80857b1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore pinned corpus
        id: corpus
        uses: actions/cache@v6
        with:
          path: ${{ env.MODULE_INFO }}
          key: corpus-${{ env.MODULE_INFO_SHA256 }}
      - name: Download pinned corpus from the release (never api.nusmods.com)
        if: steps.corpus.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl="$(mktemp -d)"
          gh release download "$PINNED_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '2026-2027-moduleInfo.json.gz' --dir "$dl"
          mkdir -p .data
          gunzip -c "$dl/2026-2027-moduleInfo.json.gz" > "$MODULE_INFO"
      - name: Verify raw sha256
        run: echo "$MODULE_INFO_SHA256  $MODULE_INFO" | sha256sum -c -
      - name: Restore the pinned vectors bundle
        id: vectors
        uses: actions/cache@v6
        with:
          path: .data/vectors
          key: vectors-${{ hashFiles('data/vectors.json') }}
      - name: Download the pinned vectors bundle from its release, sha-checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/vectors.mjs fetch --corpus pinned
      - name: Run test/sc1
        run: npx vitest run --project sc1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/sc1.json"
      - name: Fail if no SC1 test ran
        run: |
          node -e '
            const r = require(process.argv[1]);
            console.log(`passed ${r.numPassedTests}, skipped ${r.numPendingTests + r.numTodoTests}, total ${r.numTotalTests}`);
            if (r.numPassedTests === 0 || r.numPassedTests !== r.numTotalTests) process.exit(1);
          ' "$RUNNER_TEMP/sc1.json"

  # Phase 5 5B: the page in Chromium and WebKit (Playwright, with axe) against
  # the local UI stack: scripts/ui-server.mjs runs `wrangler dev --local` on
  # test/wrangler.ui.jsonc (FakeAI, no remote binding) over a D1 seeded with
  # the fixture. Like full-corpus's grid step, a diff decides whether it runs.
  ui:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Playwright's own image carries Chromium, WebKit and their system libraries, so the job
    # installs nothing with apt: installing the browsers' system libraries hung the job to its timeout
    # whenever the runner could not resolve Ubuntu's mirrors. The tag follows the locked
    # @playwright/test version (test/ci-workflow.node.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does the change touch anything the UI suite covers?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- public src test/ui test/fakes.js scripts/ui-server.mjs scripts/lib.mjs \
              wrangler.jsonc test/wrangler.ui.jsonc playwright.config.mjs migrations test/fixtures data \
              package.json package-lock.json .nvmrc .github/workflows/ci.yml; then
            run=false
          fi
          echo "ui suite: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.diff.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.diff.outputs.run == 'true'
        run: npm ci
      - name: UI suite (Chromium and WebKit)
        if: steps.diff.outputs.run == 'true'
        run: npm run test:ui
      - name: Keep the traces of failed tests
        if: failure() && steps.diff.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 7
