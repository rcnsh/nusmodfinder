name: Uptime

# ADR 0012: once an hour, three GETs to the live site (/health, one /module and
# one uncached, not-degraded /search, at least 4 s apart), checked again 90 s later on a failure.
# A pass pings the healthchecks.io check; two failures ping its /fail with a one-line reason, and
# healthchecks.io alerts Jacob through Pushover. A run that never arrives alerts after the check's
# 12 h grace (GitHub may delay or drop scheduled runs under load). The logic is in
# scripts/uptime.mjs (tested in test/uptime.node.test.js); the cron must match SCHEDULE there.
# The ping URL is the repo secret HC_UPTIME_URL, the only secret here; the script never prints it.
on:
  schedule:
    - cron: '37 * * * *'   # hourly, at minute 37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # No npm ci: the script imports only Node and the repo's own modules.
      - name: Check the site and report to healthchecks.io
        run: node scripts/uptime.mjs
        env:
          HC_UPTIME_URL: ${{ secrets.HC_UPTIME_URL }}
