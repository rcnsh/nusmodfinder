name: Deploy

# Phase 7 7B (G1, ADR 0011): a push to main deploys once that commit's CI and Findings runs have
# both succeeded. Workers Builds would deploy alongside CI rather than after it, so the repo is
# not connected there; this workflow runs `npm run deploy`, the same command the Mac runs:
# preflight, the guard over D1's REST query, upload, startup gate, promote, the deploy/* tag,
# triggers. Re-ingests (D1 writes) stay on the Mac: if D1 doesn't hold the commit's data yet, the
# guard fails the job and says so, and nothing deploys.
#
# The event fires once per workflow, so the gate (scripts/deploy-gate.mjs) deploys only when both
# runs of that sha succeeded, the sha is still main's tip, and no deploy/* tag names it yet.
# The pushed annotated tag is the durable trace; the run record is kept as an artifact. Nothing is
# ever committed from here to main (that would start CI, then a deploy, in a loop).
#
# Off until the repo variable DEPLOY_FROM_ACTIONS is 'true' (the lead turns it on after a watched
# first run). test/deploy-workflow.node.test.js holds this shape.
on:
  workflow_run:
    workflows: [CI, Findings]
    types: [completed]
    branches: [main]

permissions:
  # The deploy/* tag push.
  contents: write
  # The gate and the preflight list the sha's CI and Findings runs.
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    if: ${{ vars.DEPLOY_FROM_ACTIONS == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The preflight checks HEAD against origin/main and diffs against the live deploy tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Gate (both runs green, still main's tip, not yet deployed)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-gate.mjs --sha "${{ github.event.workflow_run.head_sha }}"
      - if: steps.gate.outputs.deploy == 'true'
        run: npm ci
      - name: The tagger of the deploy tag
        if: steps.gate.outputs.deploy == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Deploy (preflight, guard, upload, startup gate, promote, tag, triggers)
        if: steps.gate.outputs.deploy == 'true'
        env:
          # gh reads the runs and downloads the production bundle's release asset.
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Keep the run record
        if: ${{ always() && steps.gate.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-run-record-${{ github.event.workflow_run.head_sha }}
          path: docs/evidence/ops/runs/
          if-no-files-found: warn
          retention-days: 90
